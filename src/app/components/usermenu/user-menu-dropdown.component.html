<div class="dropdown-header">
  <div class="dropdown-avatar">
    {{ user.first_name?.charAt(0) || 'U' }}{{ user.last_name?.charAt(0) || '' }}
  </div>
  <div>
    <p class="dropdown-name text-neutral-900 dark:text-white">{{ user.first_name }}</p>
    <p class="dropdown-email text-neutral-500 dark:text-neutral-400">{{ user.username }}</p>
  </div>
</div>
<div class="mx-1 mt-1 rounded-2xl bg-gradient-to-br from-[#6366f1] via-[#7c6cf6] to-[#8b5cf6] p-3.5 text-white shadow-sm">
  <div class="flex items-center justify-between gap-2">
    <span class="text-[10px] font-bold uppercase tracking-widest text-white/70">Mi plan</span>
    <span class="inline-flex rounded-full bg-white px-1 py-0.5">
      <app-planbadge mode="pill" [tiendaId]="tienda?.id"></app-planbadge>
    </span>
  </div>
  <button (click)="navigateTo('/app/settings/suscripcion')"
    class="mt-2.5 w-full h-9 rounded-full bg-white/20 hover:bg-white/30 text-[13px] font-semibold transition active:scale-[0.98]">
    Ver suscripción
  </button>
</div>
<div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
<button (click)="navigateTo('/app/settings/cuenta')" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
  <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
  Configuración
</button>
<button (click)="navigateTo('/app/settings/mi-tienda')" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
  <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
  Mi Tienda
</button>
<button (click)="navigateTo('/app/settings/permisos')" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
  <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
  Mis Permisos
</button>
<button (click)="navigateTo('/app/settings/temas')" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
  <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
  Temas y UI
</button>
<button (click)="navigateTo('/app/settings/suscripcion')" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
  <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
  Suscripción
</button>
<div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
<button (click)="toggleTheme($event)" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
  <app-darkmode></app-darkmode>
  <span>Tema</span>
</button>
<div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
<button (click)="logout()" class="dropdown-item text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30">
  <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
  Cerrar Sesión
</button>
