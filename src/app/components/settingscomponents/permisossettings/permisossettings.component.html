<div *ngIf="user.permissions" style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;" class="w-full">
  <div class="max-w-5xl space-y-4 sm:space-y-5">

    <!-- Header -->
    <div class="px-1">
      <h2 class="text-lg sm:text-xl font-semibold tracking-tight text-stone-900 dark:text-white">Permisos de Usuario</h2>
      <p class="text-xs sm:text-sm text-stone-500 dark:text-stone-400">Accesos y permisos asignados a tu cuenta</p>
    </div>

    <!-- Grupos en 2 columnas en escritorio/tablet -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Secciones generadas desde el catálogo -->
      <section *ngFor="let group of groups" class="p-4 sm:p-5 bg-white dark:bg-neutral-800 rounded-3xl border border-stone-200/70 dark:border-white/10">
        <h3 class="text-[11px] font-medium text-stone-400 uppercase tracking-widest mb-3">{{ group.titulo }}</h3>
        <div class="space-y-3.5">
          <div *ngFor="let perm of group.items" class="flex items-center justify-between gap-3">
            <span class="text-sm font-medium text-stone-700 dark:text-stone-300">{{ perm.label }}</span>
            <span class="relative inline-flex items-center w-12 h-7 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="tiene(perm.key) ? 'bg-emerald-500' : 'bg-stone-200 dark:bg-white/10'">
              <span class="absolute left-0.5 flex items-center justify-center w-6 h-6 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="tiene(perm.key) ? 'translate-x-5 text-emerald-500' : 'translate-x-0 text-stone-400'">
                {{ tiene(perm.key) ? '✓' : '✕' }}
              </span>
            </span>
          </div>
        </div>
      </section>

    </div>

  </div>
</div>
