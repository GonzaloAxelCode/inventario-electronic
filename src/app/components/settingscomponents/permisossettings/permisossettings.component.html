<div *ngIf="user.permissions" class="w-full h-screen h-dvh p-0">
  <div class="max-w-3xl">

    <!-- Header -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-neutral-900 dark:text-white mb-1">Permisos de Usuario</h2>
      <p class="text-sm text-neutral-500 dark:text-neutral-400">Accesos y permisos asignados a tu cuenta</p>
    </div>

    <!-- Card unica minimalista -->
    <div class="bg-white dark:bg-neutral-800 rounded-2xl border border-neutral-200 dark:border-neutral-700/60 divide-y divide-neutral-100 dark:divide-neutral-700/40 overflow-hidden">

      <!-- Seccion: Ventas -->
      <section class="p-5 sm:p-6">
        <h3 class="text-xs font-semibold text-neutral-400 dark:text-neutral-500 uppercase tracking-widest mb-4">Ventas</h3>
        <div class="space-y-4">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Realizar ventas</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_make_sale ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_make_sale ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_make_sale ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Cancelar ventas</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_cancel_sale ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_cancel_sale ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_cancel_sale ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
        </div>
      </section>

      <!-- Seccion: Inventario -->
      <section class="p-5 sm:p-6">
        <h3 class="text-xs font-semibold text-neutral-400 dark:text-neutral-500 uppercase tracking-widest mb-4">Inventario</h3>
        <div class="space-y-4">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Crear inventario</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_create_inventory ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_create_inventory ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_create_inventory ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Modificar inventario</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_modify_inventory ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_modify_inventory ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_modify_inventory ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Eliminar inventario</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_delete_inventory ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_delete_inventory ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_delete_inventory ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
        </div>
      </section>

      <!-- Seccion: Productos -->
      <section class="p-5 sm:p-6">
        <h3 class="text-xs font-semibold text-neutral-400 dark:text-neutral-500 uppercase tracking-widest mb-4">Productos</h3>
        <div class="space-y-4">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Crear productos</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_create_product ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_create_product ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_create_product ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Actualizar productos</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_update_product ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_update_product ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_update_product ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Eliminar productos</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_delete_product ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_delete_product ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_delete_product ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
        </div>
      </section>

      <!-- Seccion: Categorias -->
      <section class="p-5 sm:p-6">
        <h3 class="text-xs font-semibold text-neutral-400 dark:text-neutral-500 uppercase tracking-widest mb-4">Categorias</h3>
        <div class="space-y-4">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Crear categorias</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_create_category ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_create_category ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_create_category ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Modificar categorias</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_modify_category ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_modify_category ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_modify_category ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-neutral-700 dark:text-neutral-300">Eliminar categorias</span>
            <span class="relative inline-flex items-center w-12 h-6 rounded-full transition-colors duration-300 flex-shrink-0"
              [class]="user.permissions.can_delete_category ? 'bg-emerald-500' : 'bg-neutral-200 dark:bg-neutral-600'">
              <span class="absolute left-0.5 flex items-center justify-center w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 text-[10px] font-bold"
                [class]="user.permissions.can_delete_category ? 'translate-x-6 text-emerald-500' : 'translate-x-0 text-neutral-500 dark:text-neutral-300'">
                {{ user.permissions.can_delete_category ? '\u2713' : '\u2715' }}
              </span>
            </span>
          </label>
        </div>
      </section>

    </div>

  </div>
</div>
