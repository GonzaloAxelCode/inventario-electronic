<div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;" class="w-full max-w-3xl space-y-4 sm:space-y-5">

  <!-- Apariencia -->
  <section>
    <div class="px-1 mb-3">
      <h2 class="text-lg sm:text-xl font-semibold tracking-tight text-stone-900 dark:text-white flex items-center gap-2">
        <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        Apariencia
      </h2>
      <p class="text-xs sm:text-sm text-stone-500 dark:text-stone-400">Personaliza la apariencia de la interfaz.</p>
    </div>

    <div class="bg-white dark:bg-neutral-800 rounded-3xl border border-stone-200/70 dark:border-white/10 divide-y divide-stone-100 dark:divide-white/5 px-4 sm:px-5">

      <!-- Modo oscuro: segmentado iOS -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 py-4">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0"
               [class]="isDarkMode ? 'bg-indigo-500/15 dark:bg-indigo-400/15' : 'bg-amber-500/15'">
            <svg *ngIf="!isDarkMode" class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg *ngIf="isDarkMode" class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </div>
          <div class="min-w-0">
            <p class="text-sm font-semibold tracking-tight text-stone-900 dark:text-white">Modo Oscuro</p>
            <p class="text-xs text-stone-500 dark:text-stone-400">
              {{ isDarkMode ? 'Interfaz oscura' : 'Interfaz clara' }}
            </p>
          </div>
        </div>
        <div class="flex items-center gap-1 p-1 rounded-full bg-stone-100 dark:bg-white/10 self-start sm:self-center shrink-0" role="group" aria-label="Modo de apariencia">
          <button type="button" class="px-4 h-8 rounded-full text-[13px] font-semibold transition-all"
            [class]="!isDarkMode ? 'bg-white dark:bg-neutral-700 text-stone-900 dark:text-white shadow-sm' : 'text-stone-500 dark:text-stone-400'"
            (click)="!isDarkMode || toggleDarkMode()">
            Claro
          </button>
          <button type="button" class="px-4 h-8 rounded-full text-[13px] font-semibold transition-all"
            [class]="isDarkMode ? 'bg-white dark:bg-neutral-700 text-stone-900 dark:text-white shadow-sm' : 'text-stone-500 dark:text-stone-400'"
            (click)="isDarkMode || toggleDarkMode()">
            Oscuro
          </button>
        </div>
      </div>

      <!-- Barra de navegación: segmentado iOS -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 py-4" [class.opacity-50]="isMobile" [class.pointer-events-none]="isMobile">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0"
               [class]="isTopnavLayout ? 'bg-emerald-500/15' : 'bg-blue-500/15'">
            <svg *ngIf="!isTopnavLayout" class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6v12"/>
            </svg>
            <svg *ngIf="isTopnavLayout" class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </div>
          <div class="min-w-0">
            <p class="text-sm font-semibold tracking-tight text-stone-900 dark:text-white">Barra de Navegación</p>
            <p class="text-xs text-stone-500 dark:text-stone-400">
              {{ isTopnavLayout ? 'Navegación superior' : 'Navegación lateral' }}
              <span *ngIf="isMobile" class="text-amber-600 dark:text-amber-400 ml-1">(No disponible en móvil)</span>
            </p>
          </div>
        </div>
        <div *ngIf="!isMobile" class="flex items-center gap-1 p-1 rounded-full bg-stone-100 dark:bg-white/10 self-start sm:self-center shrink-0" role="group" aria-label="Tipo de navegación">
          <button type="button" class="px-4 h-8 rounded-full text-[13px] font-semibold transition-all"
            [class]="!isTopnavLayout ? 'bg-white dark:bg-neutral-700 text-stone-900 dark:text-white shadow-sm' : 'text-stone-500 dark:text-stone-400'"
            (click)="!isTopnavLayout || toggleLayout()">
            Lateral
          </button>
          <button type="button" class="px-4 h-8 rounded-full text-[13px] font-semibold transition-all"
            [class]="isTopnavLayout ? 'bg-white dark:bg-neutral-700 text-stone-900 dark:text-white shadow-sm' : 'text-stone-500 dark:text-stone-400'"
            (click)="isTopnavLayout || toggleLayout()">
            Superior
          </button>
        </div>
      </div>

    </div>
  </section>

</div>
