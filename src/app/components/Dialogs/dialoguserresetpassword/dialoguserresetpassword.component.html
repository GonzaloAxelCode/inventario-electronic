<form [formGroup]="form" (ngSubmit)="onSave()" class="w-full min-w-[280px] max-w-[400px] pt-2">
  <p class="text-[12px] text-[#86868b] mb-4">
    Nueva contraseña para <span class="font-semibold text-[#1d1d1f] dark:text-white">{{ user.first_name || user.username }}</span>
  </p>

  <tui-textfield>
    <label tuiLabel>Nueva contraseña</label>
    <input placeholder="Mínimo 6 caracteres" tuiTextfield type="password" formControlName="newPassword" />
    <tui-icon tuiPassword />
  </tui-textfield>

  <div class="flex gap-2 mt-4">
    <button tuiButton appearance="outline-grayscale" size="m" type="button" (click)="onCancel()" class="flex-1 !rounded-full">Cancelar</button>
    <button tuiButton appearance="primary-grayscale" size="m" type="submit" [disabled]="form.invalid || saving" class="flex-1 !rounded-full">
      Guardar <tui-loader [showLoader]="saving" size="s"></tui-loader>
    </button>
  </div>
</form>
