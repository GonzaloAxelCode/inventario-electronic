<div>
  <div class="max-w-6xl mx-auto pt-4 rounded-lg">
    <div class="grid grid-cols-1 gap-4">

      <tui-input [(ngModel)]="form.nombre" class="w-full" placeholder="Ej: Pantalla iPhone 11 original">
        Nombre del repuesto
      </tui-input>

      <tui-select [(ngModel)]="form.categoria" [stringify]="categoriaStringify" class="w-full">
        Tipo de repuesto
        <tui-data-list *tuiDataList>
          <button *ngFor="let c of (categorias$ | async)" tuiOption [value]="c.id">{{ c.nombre }}</button>
        </tui-data-list>
      </tui-select>

      <tui-input [(ngModel)]="form.modelos" class="w-full" placeholder="iPhone 11, iPhone 12">
        Modelos compatibles
      </tui-input>

      <div class="grid grid-cols-2 gap-4">
        <tui-textfield class="w-full">
          <label tuiLabel>Cantidad</label>
          <input tuiInputNumber [(ngModel)]="form.cantidad" [min]="0" [max]="15000" [step]="1" />
        </tui-textfield>
        <tui-input [(ngModel)]="form.valorizacion" inputmode="decimal" class="w-full" placeholder="0.00">
          Valorización (S/)
        </tui-input>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <tui-select [(ngModel)]="form.proveedor" [valueContent]="proveedorContent" class="w-full">
          Proveedor
          <tui-data-list *tuiDataList>
            <button tuiOption value="">Sin proveedor</button>
            <button *ngFor="let p of (proveedores$ | async)" tuiOption [value]="p.id">{{ p.nombre }}</button>
          </tui-data-list>
        </tui-select>
        <ng-template #proveedorContent>
          <span>{{ proveedorNombre(form.proveedor) }}</span>
        </ng-template>
        <tui-input [(ngModel)]="form.ubicacion" class="w-full" placeholder="Ej: Cajón A1, Vitrina, Estante 1">
          Ubicación
        </tui-input>
      </div>

      <div class="flex flex-col">
        <input #fileInput type="file" (change)="onFotosSelected($event)" accept="image/*" multiple class="hidden" />
        <input #cameraInput type="file" (change)="onFotosSelected($event)" accept="image/*" capture="environment" class="hidden" />
        <div class="grid grid-cols-5 gap-2">
          <div *ngFor="let f of form.fotos; let i = index" class="relative group cursor-pointer overflow-hidden rounded-lg" (click)="removeFoto(i)" title="Clic para quitar">
            <span class="absolute left-1 top-1 z-10 rounded-full bg-black/70 px-1.5 py-0.5 text-[10px] font-semibold text-white">{{ i + 1 }}</span>
            <img [src]="f" class="w-full aspect-[3/4] object-cover rounded-lg shadow-md" />
            <div class="absolute inset-0 bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 transition-opacity duration-200 rounded-lg flex items-center justify-center">
              <span class="text-white text-2xl font-bold">×</span>
            </div>
            <button *ngIf="isEdit && hasFotosChanged" type="button" (click)="$event.stopPropagation(); restablecerFotos()"
              class="absolute bottom-1 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full bg-white/95 px-2 py-0.5 text-[10px] font-semibold text-neutral-900 shadow-md transition hover:bg-white active:scale-95 dark:bg-black/80 dark:text-white">
              Restablecer original
            </button>
          </div>
          <button *ngIf="form.fotos.length < 2" type="button" (click)="fileInput.click()"
            class="aspect-[3/4] w-full border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 hover:bg-gray-50 transition-all duration-200"
            title="Agregar imagen">
            <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            <span class="text-gray-400 text-[10px] mt-1 px-1 text-center">Agregar ({{ form.fotos.length }}/2)</span>
          </button>
        </div>
        <p class="text-gray-400 text-xs mt-1">Hasta 2 imágenes verticales. Clic en una imagen para quitarla.</p>
        <button *ngIf="isEdit && hasFotosChanged" type="button" (click)="restablecerFotos()"
          class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-full border border-amber-300 bg-amber-50 px-4 py-2 text-xs font-semibold text-amber-700 shadow-sm transition hover:bg-amber-100 active:scale-95 dark:border-amber-700 dark:bg-amber-900/20 dark:text-amber-300 dark:hover:bg-amber-900/30">
          Restablecer imágenes originales
        </button>
        <button type="button" (click)="cameraInput.click()"
          class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-full border border-black/10 bg-white px-4 py-2 text-xs font-semibold text-neutral-900 shadow-sm transition active:scale-95 sm:hidden dark:border-white/15 dark:bg-neutral-800 dark:text-white">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"></path>
          </svg>
          Tomar foto
        </button>
      </div>

      <div class="flex flex-col-reverse sm:flex-row gap-2">
        <button type="button" (click)="cerrar()"
          class="flex-1 rounded-full border border-black/10 dark:border-white/15 bg-transparent px-6 py-2 text-sm font-semibold text-neutral-700 dark:text-neutral-200 transition hover:bg-neutral-100 dark:hover:bg-white/10 active:scale-[0.98]">
          Cancelar
        </button>
        <button tuiButton type="button" (click)="guardar()" appearance="textfield" [disabled]="!puedeGuardar"
          class="flex-[2] px-6 py-2 transition !rounded-full dark:!bg-white dark:!text-neutral-900">
          {{ isEdit ? 'Guardar cambios' : 'Agregar repuesto' }}
        </button>
      </div>

    </div>
  </div>
</div>
