
<tui-loader [overlay]="true" [showLoader]="loaderUpdatePermission" >


<form
  [formGroup]="permissionsForm"
  class="wrapper grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 pt-6 px-4 pb-6 
         text-black dark:text-white transition-colors duration-500"
>

  <!-- 🔹 Sección genérica reutilizable -->
  <div *ngFor="let section of permissionSections" class="space-y-4">
    <h3 class="text-lg font-semibold mb-3 border-b border-neutral-400 dark:border-neutral-700 pb-2 uppercase tracking-wide">
      {{ section.title }}
    </h3>

    <div class="space-y-3">
      <label
        *ngFor="let perm of section.items"
        class="flex items-center justify-between px-4 py-3 rounded-xl cursor-pointer 
               bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700
               border border-neutral-300 dark:border-neutral-700 transition-all duration-300"
      >
        <span class="text-sm font-medium">{{ perm.label }}</span>
        <input
          tuiSwitch
          type="checkbox"
          formControlName="{{ perm.name }}"
          (change)="onPermissionChange(perm.name, $event)"
          class="accent-black dark:accent-white"
        />
      </label>
    </div>
  </div>
</form>

<!-- Apartado convertir en admin-tienda — solo superusuarios, Apple sin fondos -->
<div *ngIf="isSuperUser" class="mx-4 mb-6 rounded-2xl border border-black/[0.08] dark:border-white/[0.08] bg-transparent overflow-hidden">
  <div class="px-4 py-3 flex items-center justify-between">
    <p class="text-[11px] font-semibold tracking-widest uppercase text-[#86868b] dark:text-[#a1a1a6]">Administración de tienda</p>
    <span class="text-[10px] px-2 py-1 rounded-full bg-[#0071e3]/10 text-[#0071e3] font-medium">Solo superusuario</span>
  </div>
  <div class="h-px bg-black/[0.06] dark:bg-white/[0.06]"></div>
  <label class="flex items-center justify-between px-4 py-4 cursor-pointer hover:bg-black/[0.02] dark:hover:bg-white/[0.04] transition-colors">
    <div class="flex-1 min-w-0 pr-4">
      <p class="text-[13px] font-semibold tracking-[-0.01em] text-[#1d1d1f] dark:text-white">Convertir en admin-tienda</p>
      <p class="text-[11px] leading-4 text-[#86868b] dark:text-[#a1a1a6] mt-0.5">Permite gestionar sucursales, crear tiendas bajo su padre y acceder a <span class="font-mono">/admin/store</span> (es_propietario).</p>
      <p class="text-[11px] font-mono text-[#86868b] mt-1">Usuario: {{ user.username }} · ID {{ user.id }} · Actual: {{ isTargetAdminTienda ? 'Sí' : 'No' }}</p>
    </div>
    <input tuiSwitch type="checkbox" [checked]="isTargetAdminTienda" (change)="onAdminTiendaToggle($event)" class="shrink-0" />
  </label>
  <div class="px-4 pb-3 flex items-center gap-2 text-[11px] text-[#86868b]">
    <span class="w-1.5 h-1.5 rounded-full" [ngClass]="isTargetAdminTienda ? 'bg-[#30d158]' : 'bg-[#86868b]'"></span>
    <span>{{ isTargetAdminTienda ? 'Es admin-tienda (propietario)' : 'No es admin-tienda' }}</span>
    <span *ngIf="loadingAdminToggle" class="ml-auto text-[11px] animate-pulse">Guardando…</span>
  </div>
</div>
</tui-loader>
