<div class="form-container">
  <form [formGroup]="proveedorForm" (ngSubmit)="onSubmit()">

    <div class="grid w-full grid-cols-1 md:grid-cols-2 gap-3">
      <div class="flex flex-col gap-3">
        <tui-input formControlName="nombre" >
          Nombre
          <input placeholder="Ingrese el nombre del proveedor"  tuiTextfieldLegacy type="text" />
        </tui-input>

        <tui-input formControlName="direccion" placeholder="Ingrese la dirección">
          Dirección
        </tui-input>
      </div>

      <div class="flex flex-col gap-3">
        <tui-input formControlName="telefono" placeholder="Ingrese el teléfono" type="tel">
          Teléfono
        </tui-input>

        <tui-input formControlName="tipo_producto"  placeholder="Ingrese el tipo de producto">
          Tipo de Producto
        </tui-input>
      </div>
    </div>
<div *ngIf="!(userPermissions$ | async)?.can_update_proveedor" class="w-full col-span-2">
      
       <span class="text-yellow-400">* Permisos insuficientes para editar un proveedor </span>

    </div>


    <div *ngIf="(userPermissions$ | async)?.can_update_proveedor" class="my-3 flex flex-col-reverse sm:flex-row gap-2">
      <button type="button" (click)="onCloseDialog()"
        class="flex-1 rounded-full border border-black/10 dark:border-white/15 bg-transparent px-6 py-2 text-sm font-semibold text-neutral-700 dark:text-neutral-200 transition hover:bg-neutral-100 dark:hover:bg-white/10 active:scale-[0.98]">
        Cancelar
      </button>
      <button type="submit" [disabled]="proveedorForm.invalid"
        class="flex-[2] rounded-full bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 px-6 py-2 text-sm font-bold transition hover:opacity-90 active:scale-[0.98] disabled:opacity-40">
        Actualizar Proveedor
      </button>
    </div>
  </form>
</div>
