<!-- Main Layout -->
<div class="relative flex flex-col h-screen w-full">
  <header class="topnav-header bg-white dark:bg-neutral-800 border-b border-neutral-200 dark:border-neutral-700">
    <!-- Nav top solo para móviles: logo + hamburguesa, nada más -->
    <div class="mobile-topnav">
      <a routerLink="/app" class="logo-link">
        <img
          [src]="tienda.logo_img ? tienda.logo_img : 'https://res.cloudinary.com/ddksrkond/image/upload/c_crop,w_500,h_210,g_auto/v1764500497/logofinal_pdsf0v.png'"
          class="logo-img" alt="Logo">
      </a>
      <div class="mobile-menu-container relative">
        <button (click)="toggleMobileMenu(); $event.stopPropagation()" class="mobile-menu-button">
          <svg class="w-6 h-6 text-neutral-600 dark:text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div *ngIf="mobileMenuOpen" class="mobile-dropdown bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700">
          <div class="mobile-dropdown-header">
            <div class="dropdown-avatar">{{ user.first_name?.charAt(0) || 'U' }}{{ user.last_name?.charAt(0) || '' }}</div>
            <div>
              <p class="dropdown-name text-neutral-900 dark:text-white">{{ user.first_name }}</p>
              <p class="dropdown-email text-neutral-500 dark:text-neutral-400">{{ user.username }}</p>
            </div>
          </div>
          <div class="mx-1 mt-1 rounded-2xl bg-gradient-to-br from-[#6366f1] via-[#7c6cf6] to-[#8b5cf6] p-3.5 text-white shadow-sm">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] font-bold uppercase tracking-widest text-white/70">Mi plan</span>
              <span class="inline-flex rounded-full bg-white px-1 py-0.5">
                <app-planbadge mode="pill" [tiendaId]="tienda?.id"></app-planbadge>
              </span>
            </div>
            <button (click)="navigateTo('/app/settings/suscripcion')"
              class="mt-2.5 w-full h-9 rounded-full bg-white/20 hover:bg-white/30 text-[13px] font-semibold transition active:scale-[0.98]">
              Ver suscripción
            </button>
          </div>
          <div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
          <nav class="mobile-nav-links">
            <ng-container *ngFor="let item of allNavItems">
              <a *ngIf="(!item.superuserOnly || user.is_superuser) && (!item.featureFlag || (item.featureFlag === 'tiktok' && featureFlags.tiktokEnabled()))"
                [routerLink]="item.route"
                (click)="closeMobileMenu()"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                routerLinkActive="nav-link-active"
                class="mobile-nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icon"/>
                </svg>
                {{ item.label }}
              </a>
            </ng-container>
          </nav>
          <div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
          <button (click)="navigateTo('/app/settings/cuenta')" class="mobile-nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
            Configuración
          </button>
          <div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
          <button (click)="toggleTheme($event)" class="dropdown-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700">
            <app-darkmode></app-darkmode><span>Tema</span>
          </button>
          <div class="dropdown-divider bg-neutral-200 dark:bg-neutral-700"></div>
          <button (click)="logout2()" class="dropdown-item text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30">
            <svg class="dropdown-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
    <div class="topnav-container">
    <!-- Logo -->
    <div class="topnav-logo">
      <a routerLink="/app" class="logo-link">
        <img
          [src]="tienda.logo_img ? tienda.logo_img : 'https://res.cloudinary.com/ddksrkond/image/upload/c_crop,w_500,h_210,g_auto/v1764500497/logofinal_pdsf0v.png'"
          class="logo-img" alt="Logo">
      </a>
    </div>

    <!-- Desktop Navigation Links -->
    <div class="topnav-nav-area hidden md:flex">
      <nav class="topnav-links" #navContainer>
        <ng-container *ngFor="let item of visibleItems">
          <div class="nav-item-dropdown-container">
            <button
              (click)="toggleItemDropdown($event, item)"
              class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icon"/>
              </svg>
              <span>{{ item.label }}</span>
              <svg class="chevron-down" [class.open]="activeDropdownItem?.label === item.label" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
          </div>
        </ng-container>
      </nav>

      <!-- Overflow "Más" Button + Dropdown -->
      <div class="overflow-menu-container relative" *ngIf="hiddenItems.length > 0">
        <button
          (click)="toggleOverflowMenu(); $event.stopPropagation()"
          class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white cursor-pointer">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01"/>
          </svg>
          <span>Más</span>
          <svg class="chevron-down" [class.open]="overflowMenuOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Items en "Más": abren dropdown igual -->
        <div *ngIf="overflowMenuOpen"
          class="overflow-dropdown bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700">
          <ng-container *ngFor="let item of hiddenItems">
            <button
              (click)="toggleItemDropdown($event, item); closeOverflowMenu()"
              class="overflow-item text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
              <svg class="overflow-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icon"/>
              </svg>
              <span>{{ item.label }}</span>
              <svg class="chevron-down-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Right Side: User Menu -->
    <div class="topnav-right">
      <!-- User Menu -->
      <div class="user-menu-container relative hidden md:block">
        <button
          (click)="toggleUserMenu(); $event.stopPropagation()"
          class="user-menu-trigger hover:bg-neutral-100 dark:hover:bg-neutral-700">
          <div class="user-avatar">
            {{ user.first_name?.charAt(0) || 'U' }}{{ user.last_name?.charAt(0) || '' }}
          </div>
          <div class="user-info">
            <span class="user-name text-neutral-900 dark:text-white">{{ user.username }}</span>
            <span class="user-role text-neutral-500 dark:text-neutral-400">{{ user.is_superuser ? 'Administrador' : 'Personal' }}</span>
          </div>
          <svg class="chevron-icon text-neutral-400" [class.rotate-180]="userMenuOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div *ngIf="userMenuOpen" class="user-dropdown bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700">
          <app-user-menu-dropdown [user]="user" [tienda]="tienda" (closed)="userMenuOpen = false"></app-user-menu-dropdown>
        </div>
      </div>

    </div>
  </div>
  </header>

  <div class="flex-1 relative overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- UNICO dropdown universal para todos los links -->
<div *ngIf="activeDropdownItem?.subItems"
  class="item-dropdown bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700"
  [style.left.px]="dropdownPosition.x"
  [style.top.px]="dropdownPosition.y"
  (mouseenter)="onDropdownEnter()"
  (mouseleave)="onDropdownLeave()">
  <div class="item-dropdown-header">
    <svg class="item-dropdown-header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" [style.color]="activeDropdownItem!.accent || null">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="activeDropdownItem!.icon"/>
    </svg>
    <span class="item-dropdown-header-label">{{ activeDropdownItem!.label }}</span>
  </div>
  <div class="item-dropdown-divider"></div>
  <div class="item-dropdown-grid">
    <button *ngFor="let sub of activeDropdownItem!.subItems"
      (click)="navigateTo(sub.route)"
      class="item-dropdown-card">
      <div class="item-dropdown-card-icon" [style.background]="soft(sub.accent || activeDropdownItem!.accent)" [style.color]="sub.accent || activeDropdownItem!.accent || null">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="sub.icon"/>
        </svg>
      </div>
      <div class="item-dropdown-card-content">
        <span class="item-dropdown-card-label">{{ sub.label }}</span>
        <span class="item-dropdown-card-desc" *ngIf="sub.description">{{ sub.description }}</span>
      </div>
      <svg class="item-dropdown-card-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>
