<ng-template #sidebarTemplate>
  <nav class="sidebar-nav bg-white dark:bg-neutral-800 border-r border-neutral-200 dark:border-neutral-700">

    <!-- Logo -->
    <div class="sidebar-logo border-b border-neutral-200 dark:border-neutral-700">
      <a routerLink="/app" (click)="onClose()" class="logo-link">
        <img
          [src]="tienda.logo_img ? tienda.logo_img : 'https://res.cloudinary.com/ddksrkond/image/upload/c_crop,w_500,h_210,g_auto/v1764500497/logofinal_pdsf0v.png'"
          class="logo-img" alt="Logo">
      </a>
    </div>

    <!-- Navigation Links -->
    <div class="sidebar-nav-links">
      <a routerLink="/app" (click)="onClose()" [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span>Estadisticas</span>
      </a>

      <a routerLink="/app/productos" (click)="onClose()"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
        <span>Productos</span>
      </a>

      <a routerLink="/app/ventas" (click)="onClose()" [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
        <span>Ventas</span>
      </a>

      <a routerLink="/app/ventas/crear" (click)="onClose()"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
        </svg>
        <span>Vender</span>
      </a>

      <a routerLink="/app/clientes" (click)="onClose()"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <span>Mis clientes</span>
      </a>

      <a routerLink="/app/compras" (click)="onClose()"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <span>Compras</span>
      </a>

      <a routerLink="/app/pedidos" (click)="onClose()"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <span>Pedidos</span>
      </a>

      <a routerLink="/app/ganancias" (click)="onClose()"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="flex items-center gap-1.5">Ganancias
        </span>
      </a>

      <a routerLink="/app/tiendas" (click)="onClose()" *ngIf="user.is_superuser"
        routerLinkActive="nav-link-active" class="nav-link text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700 hover:text-neutral-900 dark:hover:text-white">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <span>Tiendas</span>
      </a>
    </div>

    <!-- User Menu -->
    <div class="sidebar-footer border-t border-neutral-200 dark:border-neutral-700">
      <div class="user-menu-container relative">
        <button
          (click)="toggleUserMenu(); $event.stopPropagation()"
          class="user-menu-trigger hover:bg-neutral-100 dark:hover:bg-neutral-700">
          <div class="user-avatar">
            {{ user.first_name?.charAt(0) || 'U' }}{{ user.last_name?.charAt(0) || '' }}
          </div>
          <div class="user-info">
            <span class="user-name text-neutral-900 dark:text-white">{{ user.first_name }} {{ user.last_name }}</span>
            <span class="user-role text-neutral-500 dark:text-neutral-400">{{ user.is_superuser ? 'Desarrollador' : 'Personal' }}</span>
            <app-planbadge mode="pill" [tiendaId]="tienda?.id"></app-planbadge>
          </div>
          <svg class="chevron-icon text-neutral-400" [class.rotate-180]="userMenuOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Dropdown (mismo contenido que nav top) -->
        <div *ngIf="userMenuOpen" class="user-dropdown bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700">
          <app-user-menu-dropdown [user]="user" [tienda]="tienda" (closed)="onUserMenuClosed()"></app-user-menu-dropdown>
        </div>
      </div>
    </div>
  </nav>
</ng-template>

<!-- Mobile Drawer -->
<div class="flex md:hidden">
  <tui-drawer *tuiPopup="open()" direction="left" class="drawer" [overlay]="true" (click.self)="onClose()">
    <aside class="relative">
      <div class="absolute right-4 top-4 z-10">
        <button class="bg-white dark:bg-neutral-900 shadow-lg" tuiButton type="button" iconStart="@tui.x" size="s"
          appearance="floating" (click)="onClose()">
        </button>
      </div>
      <ng-container *ngTemplateOutlet="sidebarTemplate"></ng-container>
    </aside>
  </tui-drawer>
</div>

<!-- Main Layout -->
<div class="relative flex h-screen w-full">
  <div class="flex w-full mx-auto">
    <!-- Desktop Sidebar -->
    <aside class="hidden md:block bg-white dark:bg-neutral-800 w-[14rem] shrink-0">
      <ng-container *ngTemplateOutlet="sidebarTemplate"></ng-container>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 relative flex flex-col h-screen">
      <div class="flex-1 overflow-y-auto min-h-0">
        <app-header></app-header>
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
