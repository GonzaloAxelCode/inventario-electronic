<main tuiNavigationMain class="p-2 sm:p-6">
    <header tuiSubheader class="p-0 mb-5">
            <h2 class="text-[22px] sm:text-[26px] font-bold tracking-tight text-neutral-900 dark:text-white">Compras</h2>
            <p class="text-[13px] text-neutral-500 dark:text-neutral-400 mt-0.5 mb-4">Valida comprobantes en SUNAT y lleva tu registro</p>

            <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
                class="flex gap-2 overflow-x-auto whitespace-nowrap">
                <button tuiTab type="button">Consultar y guardar</button>
                <button tuiTab type="button">Mis compras</button>
            </nav>
        </header>

        <ng-container *ngIf="activeTab === 'consultar'">
            <app-consultar-compra></app-consultar-compra>
        </ng-container>

        <ng-container *ngIf="activeTab === 'mis-compras'">
            <app-mis-compras></app-mis-compras>
        </ng-container>

</main>
