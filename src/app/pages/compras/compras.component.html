<main tuiNavigationMain class="p-2 sm:p-6">
    <header tuiSubheader class="p-0 mb-4">
        <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Gestión de Compras</h2>
        <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">Registra compras, proveedores y comprobantes</p>

        <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
            class="flex gap-2 overflow-x-auto whitespace-nowrap">
            <button tuiTab type="button">Historial de Compras</button>
            <button tuiTab type="button">Registrar Comprobantes</button>
            <button tuiTab type="button" class="relative">
                Gráficos
                <span class="ml-1.5 text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400">BETA</span>
            </button>
        </nav>
    </header>

    <ng-container *ngIf="activeTab === 'historial'">
        <app-listallcompras></app-listallcompras>
    </ng-container>

    <ng-container *ngIf="activeTab === 'comprobantes'">
        <app-registrarcompra></app-registrarcompra>
    </ng-container>

    <ng-container *ngIf="activeTab === 'graficos'">
        <div class="flex flex-col items-center justify-center py-20 px-4">
            <div class="w-20 h-20 rounded-2xl bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center mb-6">
                <svg class="w-10 h-10 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-neutral-900 dark:text-white mb-2">Gráficos</h3>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 mb-4">BETA</span>
            <p class="text-sm text-neutral-500 dark:text-neutral-400 text-center max-w-md">
                Próximamente podrás visualizar gráficos detallados de tus compras, tendencias y análisis de gastos.
            </p>
        </div>
    </ng-container>

</main>
