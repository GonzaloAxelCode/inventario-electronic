<main tuiNavigationMain class="p-4 sm:p-6">
    <header tuiSubheader class="p-0 mb-4">
        <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Gestión de Compras</h2>
        <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">Registra compras, proveedores y comprobantes</p>

        <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
            class="flex gap-2 overflow-x-auto whitespace-nowrap">
            <button tuiTab type="button">Historial de Compras</button>
            <button tuiTab type="button">Registrar Comprobantes</button>
            <button tuiTab type="button">Subir por archivo Excel</button>
        </nav>
    </header>

    <ng-container *ngIf="activeTab === 'historial'">
        <app-listallcompras></app-listallcompras>
    </ng-container>

    <ng-container *ngIf="activeTab === 'comprobantes'">
        <app-registrarcompra></app-registrarcompra>
    </ng-container>

    <ng-container *ngIf="activeTab === 'excel'">
        <app-subirexcel></app-subirexcel>
    </ng-container>

</main>
