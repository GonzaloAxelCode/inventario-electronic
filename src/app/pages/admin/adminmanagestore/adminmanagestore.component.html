<div class="min-h-screen bg-transparent">
  <div class="max-w-[1200px] mx-auto px-6 md:px-8 py-8">
    <!-- Header -->
    <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div class="min-w-0">
        <div class="flex items-center gap-2.5">
          <h1 class="text-[26px] md:text-[28px] font-semibold tracking-[-0.03em] leading-none text-[#1d1d1f] dark:text-white antialiased">
            {{ (gestionTitle$ | async) || 'Gestión de Tiendas' }}
          </h1>
          <span class="hidden sm:inline-flex items-center gap-1.5 text-[#86868b] dark:text-[#a1a1a6]">
            <span class="w-2 h-2 rounded-full bg-[#30d158]"></span>
            <span class="text-[11px] font-medium tracking-wide uppercase">Admin</span>
          </span>
        </div>
        <p *ngIf="gestionSubtitle$ | async as subtitle" class="text-[13px] leading-5 text-[#86868b] dark:text-[#a1a1a6] mt-2 font-normal">
          {{ subtitle }}
          <ng-container *ngIf="(isSuperUser$ | async) && (filteredTiendas$ | async) as filtered"> · {{ filtered.length }} {{ filtered.length === 1 ? 'tienda' : 'tiendas' }}</ng-container>
        </p>
        <p *ngIf="(isSuperUser$ | async) === false" class="text-[12px] text-[#86868b] dark:text-[#a1a1a6] mt-1">
          Mostrando solo tu tienda y sucursales asociadas
        </p>
      </div>
      <div class="flex items-center gap-2">
        <button
          *ngIf="isSuperUser$ | async"
          type="button"
          (click)="showDialog()"
          class="inline-flex items-center justify-center gap-1.5 h-9 px-6 rounded-full bg-[#1d1d1f] dark:bg-white text-white dark:text-black text-[13px] font-medium tracking-[-0.01em] transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          Nueva tienda
        </button>
      </div>
    </div>

    <!-- Tiendas padre (todas, sin filtro por propietario) -->
    <div>
      <ng-container *ngIf="filteredTiendas$ | async as filtered">
        <div [tuiSkeleton]="(loadingTiendas$ | async) === true" class="rounded-2xl">
          <app-tabletiendas [tiendas]="filtered" [mostrarContador]="(isSuperUser$ | async) === true" (crearSucursal)="showDialog($event)"></app-tabletiendas>
        </div>
        <p *ngIf="filtered.length === 0 && (isSuperUser$ | async) === false" class="text-[13px] text-[#86868b] dark:text-[#a1a1a6] mt-6 text-center">
          No se encontraron sucursales. Se muestra tu tienda principal.
        </p>
        <p *ngIf="filtered.length === 0 && (isSuperUser$ | async) === true" class="text-[13px] text-[#86868b] dark:text-[#a1a1a6] mt-6 text-center">
          Aún no hay tiendas creadas.
        </p>
      </ng-container>
    </div>
  </div>
</div>
