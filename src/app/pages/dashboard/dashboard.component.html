<div class="p-4 sm:p-6">

    <header tuiSubheader class="p-0 mb-4">
        <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Estadísticas de la tienda</h2>
        <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">Resumen de ventas, inventario y rendimiento</p>

        <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
            class="flex gap-2 overflow-x-auto whitespace-nowrap">
            <button tuiTab type="button">General</button>
            <button tuiTab type="button">Resumen del Día</button>
            <button tuiTab type="button">Inventario y Alertas</button>
            <button tuiTab type="button">Comparaciones y Rendimiento</button>
        </nav>
    </header>

    <!-- TAB: GENERAL -->
    <ng-container *ngIf="activeTab === 'general'">
        <div class="flex flex-col gap-6">
            <app-dashboard-sales-cards></app-dashboard-sales-cards>
            <app-graficos-inicio [activeTab]="activeTab"></app-graficos-inicio>
            <div>
                <p class="text-2xl font-bold text-slate-700 dark:text-gray-300 mb-4">Ventas por rango de fecha</p>
                <app-chartsalesbetweentwodates></app-chartsalesbetweentwodates>
            </div>
            <app-dashboard-general-stats></app-dashboard-general-stats>
        </div>
    </ng-container>

    <!-- TAB: RESUMEN DEL DÍA -->
    <ng-container *ngIf="activeTab === 'resumen'">
        <div class="flex flex-col gap-6">
            <p class="text-2xl font-bold text-slate-700 dark:text-gray-300">Resumen del Día</p>
            <app-dashboard-daily-summary></app-dashboard-daily-summary>
        </div>
    </ng-container>

    <!-- TAB: INVENTARIO Y ALERTAS -->
    <ng-container *ngIf="activeTab === 'inventario'">
        <app-alertas-stock></app-alertas-stock>
    </ng-container>

    <!-- TAB: COMPARACIONES Y RENDIMIENTO -->
    <ng-container *ngIf="activeTab === 'comparacion'">
        <app-graficos-inicio [activeTab]="activeTab"></app-graficos-inicio>
    </ng-container>

</div>
