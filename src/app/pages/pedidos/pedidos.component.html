<main tuiNavigationMain class="p-4 sm:p-6">
    <header tuiSubheader class="p-0 mb-4">
        <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Gestión de Pedidos</h2>
        <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">Crea y gestiona pedidos de clientes</p>

        <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
            class="flex gap-2 overflow-x-auto whitespace-nowrap">
            <button tuiTab type="button">Historial de Pedidos</button>
            <button tuiTab type="button">Crear Pedido</button>
        </nav>
    </header>

    <ng-container *ngIf="activeTab === 'historial'">
        <app-listallpedidos></app-listallpedidos>
    </ng-container>

    <ng-container *ngIf="activeTab === 'crear'">
        <app-registrarpedido></app-registrarpedido>
    </ng-container>

</main>
