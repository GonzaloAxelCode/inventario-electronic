<main style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;" class="p-3 sm:p-6">
  <div class="max-w-7xl mx-auto min-w-0">

    <!-- Header Apple -->
    <div class="mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="min-w-0">
        <h2 class="text-lg sm:text-xl font-semibold tracking-tight text-stone-900 dark:text-white">Guías de Remisión</h2>
        <p class="text-xs text-stone-400 dark:text-stone-400 mt-0.5">Gestiona guías de remisión electrónicas</p>
      </div>
      <a routerLink="/app/guia-remision/nueva" class="inline-flex items-center justify-center gap-1.5 h-11 px-6 rounded-full bg-black dark:bg-white text-white dark:text-black text-sm font-semibold hover:opacity-90 transition-opacity shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        Nueva Guía
      </a>
    </div>

    <!-- FILTROS DE BUSQUEDA -->
    <search tuiSearch class="block bg-white dark:bg-neutral-800 rounded-3xl border border-stone-200/70 dark:border-white/10 p-4 sm:p-5 mb-5">
      <!-- Rango de fechas -->
      <p class="text-[11px] text-stone-400 mb-1.5">Escoje buscar las guías entre dos fechas</p>
      <div class="mb-4 w-full min-w-0">
        <tui-input-date-range (ngModelChange)="onRangeChange($event)" [maxLength]="maxLength" [ngModel]="range"
          class="w-full">
          Escoje buscar las guías entre dos fechas
        </tui-input-date-range>
      </div>

      <!-- Toolbar: Resultados + Acciones -->
      <fieldset class="mb-1">
        <div class="flex flex-wrap items-center justify-between gap-2 sm:gap-3 bg-transparent border-0 px-1 sm:px-2 py-1">

          <!-- Izquierda: Contador -->
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[11px] text-stone-400">Resultados:</span>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-white dark:bg-stone-800 shadow-sm text-xs font-semibold text-stone-900 dark:text-white">
              0
            </span>
          </div>

          <!-- Derecha: Acciones -->
          <div class="flex items-center gap-2 min-w-0">
            <!-- Toggle Vista: segmentado iOS -->
            <div class="flex items-center gap-0.5 bg-white dark:bg-stone-800 rounded-full p-1 shadow-sm">
              <button type="button" (click)="viewMode = 'table'"
                [class]="viewMode === 'table' ? 'p-2 rounded-full bg-black dark:bg-white text-white dark:text-black shadow-sm transition-all' : 'p-2 rounded-full text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 transition-all'">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                </svg>
              </button>
              <button type="button" (click)="viewMode = 'grid'"
                [class]="viewMode === 'grid' ? 'p-2 rounded-full bg-black dark:bg-white text-white dark:text-black shadow-sm transition-all' : 'p-2 rounded-full text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 transition-all'">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
                </svg>
              </button>
            </div>

            <!-- Boton Limpiar -->
            <button appearance="flat" iconStart="@tui.rotate-cw" size="s" tuiButton type="button"
              (click)="clearFilters()" class="!rounded-full">
              <span class="text-xs">Limpiar</span>
            </button>

            <!-- Toggle Filtros -->
            <button type="button" (click)="expanded = !expanded"
              class="flex items-center gap-1.5 h-9 px-4 rounded-full text-xs font-semibold transition-all"
              [class]="expanded ? 'bg-black dark:bg-white text-white dark:text-black' : 'bg-white dark:bg-stone-800 text-stone-900 dark:text-white shadow-sm hover:opacity-90'">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"/>
              </svg>
              Filtros
            </button>
          </div>
        </div>
      </fieldset>

      <form [formGroup]="form" (submit)="onSearch()">
        <tui-expand [expanded]="expanded">
          <div class="space-y-3 pt-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 w-full min-w-0">
              <tui-textfield iconStart="@tui.search" class="w-full min-w-0">
                <input size="s" formControlName="numero_guia" placeholder="N° Guía" tuiTextfield />
              </tui-textfield>

              <tui-textfield iconStart="@tui.search" class="w-full min-w-0">
                <input size="s" formControlName="nombre_destinatario" placeholder="Destinatario" tuiTextfield />
              </tui-textfield>

              <tui-select class="w-full min-w-0" formControlName="estado">
                <ng-container ngProjectAs="tuiLabel">
                  <span>Estado</span>
                </ng-container>
                <select placeholder="Estado" size="m" tuiSelect [items]="estados"></select>
              </tui-select>
            </div>

            <div class="flex flex-row items-center gap-3">
              <button type="submit" iconStart="@tui.search" tuiButton appearance="primary"
                class="col-span-1 w-full flex-1 !rounded-full">
                Buscar
              </button>
            </div>
          </div>
        </tui-expand>
      </form>
    </search>

    <!-- LISTA -->
    <app-listaguias (verDetalle)="onVerDetalle($event)" (editarGuia)="onVerDetalle($event)"></app-listaguias>

  </div>

  <!-- MODAL DETALLE -->
  <div *ngIf="guiaSeleccionada" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="absolute inset-0 bg-black/40" (click)="cerrarDetalle()"></div>
    <div class="relative max-w-4xl mx-auto my-4 sm:my-8 px-3 sm:px-4">
      <div class="bg-stone-50 dark:bg-neutral-900 rounded-3xl p-3 sm:p-5 shadow-xl">
        <app-detalleguia [guia]="guiaSeleccionada" (cerrar)="cerrarDetalle()"></app-detalleguia>
      </div>
    </div>
  </div>
</main>
