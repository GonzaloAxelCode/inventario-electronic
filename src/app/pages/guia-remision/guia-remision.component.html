<main class="p-4 sm:p-6">
  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="mb-6">
      <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Guías de Remisión</h2>
      <p class="text-xs text-neutral-500 dark:text-neutral-400">Gestiona guías de remisión electrónicas</p>
    </div>

    <!-- FILTROS DE BUSQUEDA -->
    <search tuiSearch>
      <!-- Rango de fechas -->
      <div class="mb-4 w-full">
        <tui-input-date-range (ngModelChange)="onRangeChange($event)" [maxLength]="maxLength" [ngModel]="range"
          class="w-full">
          Escoje buscar las guías entre dos fechas
        </tui-input-date-range>
      </div>

      <!-- Toolbar: Resultados + Acciones -->
      <fieldset class="mb-4">
        <div class="flex items-center justify-between gap-3 bg-neutral-50 dark:bg-neutral-800/50 rounded-xl px-4 py-3">

          <!-- Izquierda: Contador -->
          <div class="flex items-center gap-2">
            <span class="text-xs text-neutral-500 dark:text-neutral-400">Resultados:</span>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-neutral-200 dark:bg-neutral-700 text-xs font-bold text-neutral-900 dark:text-white">
              0
            </span>
          </div>

          <!-- Derecha: Acciones -->
          <div class="flex items-center gap-2">
            <!-- Toggle Vista -->
            <div class="flex items-center gap-0.5 bg-neutral-200 dark:bg-neutral-700 rounded-lg p-0.5">
              <button type="button" (click)="viewMode = 'table'"
                [class]="viewMode === 'table' ? 'px-2.5 py-1.5 rounded-md bg-white dark:bg-neutral-600 text-neutral-900 dark:text-white shadow-sm transition-all' : 'px-2.5 py-1.5 rounded-md text-neutral-500 dark:text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300 transition-all'">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                </svg>
              </button>
              <button type="button" (click)="viewMode = 'grid'"
                [class]="viewMode === 'grid' ? 'px-2.5 py-1.5 rounded-md bg-white dark:bg-neutral-600 text-neutral-900 dark:text-white shadow-sm transition-all' : 'px-2.5 py-1.5 rounded-md text-neutral-500 dark:text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300 transition-all'">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
                </svg>
              </button>
            </div>

            <!-- Separador -->
            <div class="w-px h-6 bg-neutral-300 dark:bg-neutral-600"></div>

            <!-- Boton Limpiar -->
            <button appearance="flat" iconStart="@tui.rotate-cw" size="s" tuiButton type="button"
              (click)="clearFilters()" class="!rounded-lg">
              <span class="text-xs">Limpiar</span>
            </button>

            <!-- Toggle Filtros -->
            <button type="button" (click)="expanded = !expanded"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all"
              [class]="expanded ? 'bg-neutral-900 dark:bg-white text-white dark:text-neutral-900' : 'bg-neutral-200 dark:bg-neutral-700 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-300 dark:hover:bg-neutral-600'">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"/>
              </svg>
              Filtros
            </button>
          </div>
        </div>
      </fieldset>

      <form [formGroup]="form" (submit)="onSearch()">
        <tui-expand [expanded]="expanded">
          <div class="space-y-3 pb-3">
            <div class="flex flex-wrap xl:flex-nowrap gap-3 w-full">
              <tui-textfield iconStart="@tui.search" class="w-full">
                <input size="s" formControlName="numero_guia" placeholder="N° Guía" tuiTextfield />
              </tui-textfield>

              <tui-textfield iconStart="@tui.search" class="w-full">
                <input size="s" formControlName="nombre_destinatario" placeholder="Destinatario" tuiTextfield />
              </tui-textfield>

              <tui-select class="w-full" formControlName="estado">
                <ng-container ngProjectAs="tuiLabel">
                  <span>Estado</span>
                </ng-container>
                <select placeholder="Estado" size="m" tuiSelect [items]="estados"></select>
              </tui-select>
            </div>

            <div class="flex flex-row items-center gap-3">
              <button type="submit" iconStart="@tui.search" tuiButton appearance="textfield"
                class="col-span-1 w-full flex-1">
                Buscar
              </button>
            </div>
          </div>
        </tui-expand>
      </form>
    </search>

    <!-- EMPTY STATE -->
    <div class="flex flex-col items-center justify-center py-20 text-center">
      <svg class="w-16 h-16 mb-4 text-neutral-300 dark:text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.25 7.5V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/>
      </svg>
      <h2 class="text-xl font-bold text-neutral-600 dark:text-neutral-300 mb-2">No hay guías de remisión</h2>
      <p class="text-sm text-neutral-400 dark:text-neutral-500">Las guías de remisión que registres aparecerán aquí</p>
    </div>

  </div>
</main>
