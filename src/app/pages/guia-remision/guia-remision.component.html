<main tuiNavigationMain class="p-4 sm:p-6">
    <header tuiSubheader class="p-0 mb-4">
        <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Guías de Remisión</h2>
        <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">Gestiona guías de remisión electrónicas</p>

        <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
            class="flex gap-2 overflow-x-auto whitespace-nowrap">
            <button tuiTab type="button">Guías Registradas</button>
            <button tuiTab type="button">Nueva Guía</button>
        </nav>
    </header>

    <ng-container *ngIf="activeTab === 'lista' && !guiaSeleccionada">
        <app-listaguias (verDetalle)="onVerDetalle($event)" (editarGuia)="onEditarGuia($event)"></app-listaguias>
    </ng-container>

    <ng-container *ngIf="activeTab === 'lista' && guiaSeleccionada">
        <app-detalleguia [guia]="guiaSeleccionada" (cerrar)="onCerrarDetalle()"></app-detalleguia>
    </ng-container>

    <ng-container *ngIf="activeTab === 'registrar'">
        <app-formguia (cancelar)="onCancelarForm()"></app-formguia>
    </ng-container>

</main>
