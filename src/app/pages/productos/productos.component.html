<main tuiNavigationMain class="p-2 sm:p-4 md:p-6">
    <header tuiSubheader class="p-0 mb-4">
        <h2 class="text-lg sm:text-xl font-bold text-neutral-900 dark:text-white">Gestión de Productos</h2>
        <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">Administra tu catálogo, categorías e inventario</p>

        <nav tuiTabs [(activeItemIndex)]="activeTabIndex" (activeItemIndexChange)="onTabChange($event)"
            class="flex gap-2 overflow-x-auto whitespace-nowrap">
            <button tuiTab type="button">Productos</button>
            <button tuiTab type="button">Categorías</button>
            <button tuiTab type="button">Gráficos</button>
            <button tuiTab type="button">Agregar productos por Excel <span class="ml-1 text-[10px] font-bold text-amber-600 bg-amber-100 dark:text-amber-400 dark:bg-amber-900/30 px-1.5 py-0.5 rounded-full">BETA</span></button>
        </nav>
    </header>

    <ng-container *ngIf="activeTab === 'productos'">
        <div class="flex gap-2 mb-4">
            <button iconStart="@tui.plus" tuiButton appearance="textfield" tuiButtonVertical type="button"
                (click)="showDialogCreateProduct()">
                Agregar nuevo producto
            </button>
            <app-buttonupdate [func]="clickRefreshProducts.bind(this)" [loading]="loading"></app-buttonupdate>
        </div>
        <app-tableproduct></app-tableproduct>
    </ng-container>

    <ng-container *ngIf="activeTab === 'categorias'">
        <div class="flex gap-2 mb-4">
            <button iconStart="@tui.plus" tuiButton appearance="textfield" tuiButtonVertical type="button"
                (click)="showDialogCreateCategoria()">
                Agregar categoria
            </button>
        </div>
        <app-tablecategories></app-tablecategories>
    </ng-container>

    <ng-container *ngIf="activeTab === 'graficos'">
        <app-graficos-productos></app-graficos-productos>
    </ng-container>

    <ng-container *ngIf="activeTab === 'excel'">
        <div class="flex flex-col items-center justify-center py-16 px-4">
            <div class="text-center">
                <span class="text-6xl mb-4 block">🚧</span>
                <h3 class="text-xl font-bold text-neutral-900 dark:text-white mb-2">Próximamente</h3>
                <p class="text-sm text-neutral-500 dark:text-neutral-400 max-w-md">
                    La funcionalidad de agregar productos por Excel está en desarrollo. Estará disponible pronto.
                </p>
                <span class="inline-block mt-4 text-xs font-bold text-amber-600 bg-amber-100 dark:text-amber-400 dark:bg-amber-900/30 px-3 py-1.5 rounded-full">
                    BETA
                </span>
            </div>
        </div>
    </ng-container>

</main>
