<tui-root [attr.tuiTheme]="darkMode() ? 'dark' : null" class="relative">
  
  <!-- Si está cargando: loader -->
  <ng-container *ngIf="loading$ | async; else appContent">
    <div class="loader-overlay" [class.loader-dark]="darkMode()">
      <div class="loader-content">
        <img *ngIf="!darkMode()" 
             src="/assets/LOGOS/logo-ligth-theme2000x2000.png" 
             class="loader-logo" 
             alt="Gonza Fact">
        <img *ngIf="darkMode()" 
             src="/assets/LOGOS/logo-dark-theme2000x2000.png" 
             class="loader-logo" 
             alt="Gonza Fact">
        
        <div class="loader-spinner">
          <div class="spinner-ring"></div>
          <div class="spinner-ring"></div>
          <div class="spinner-ring"></div>
        </div>
        
        <p class="loader-text">Gonza <span class="loader-text-orange">Fact</span></p>
      </div>
    </div>
  </ng-container>

  <!-- Si NO está cargando: app normal -->
  <ng-template #appContent>
    <router-outlet></router-outlet>
  </ng-template>

</tui-root>
